[project]
name = "business-code-agent"
version = "0.1.0"
description = "Evidence-first business code intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1,<2",
]

[project.optional-dependencies]
tree-sitter = ["tree-sitter>=0.25", "tree-sitter-java>=0.23"]
langgraph = ["langgraph>=1.1.10,<1.2"]

[project.scripts]
business-code-agent = "business_code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["business_code_agent*"]
