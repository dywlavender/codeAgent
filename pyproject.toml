[project]
name = "business-code-agent"
version = "0.1.0"
description = "Evidence-first business code intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "langchain==1.2.18",
  "langchain-openai==1.6.0",
]

[project.optional-dependencies]
# tree-sitter 0.26.0 segfaults on Python 3.14: its Node objects get freed by a
# mid-run GC pass while still referenced (reproduced indexing large Java repos).
# Re-enable 0.26 once upstream fixes the GC lifetime declarations.
tree-sitter = ["tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23", "tree-sitter-javascript>=0.25", "tree-sitter-typescript>=0.23"]
retrieval = ["numpy>=2.3,<3", "onnxruntime>=1.23,<2", "tokenizers>=0.22,<1", "huggingface-hub>=0.36,<2"]
# 只读业务知识 MCP 服务（serve-mcp）。MCP SDK 只在需要该能力时安装，
# 基础依赖和离线包不引入它及其传输层依赖。
mcp = ["mcp>=2.3,<3"]

[project.scripts]
business-code-agent = "business_code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["business_code_agent*"]

[tool.setuptools.package-data]
"business_code_agent.query.agent.pi" = ["extension/*.js"]
