[project]
name = "business-code-agent"
version = "0.1.0"
description = "Evidence-first business code intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1,<2",
]

[project.optional-dependencies]
# tree-sitter 0.26.0 segfaults on Python 3.14: its Node objects get freed by a
# mid-run GC pass while still referenced (reproduced indexing large Java repos).
# Re-enable 0.26 once upstream fixes the GC lifetime declarations.
tree-sitter = ["tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23"]

[project.scripts]
business-code-agent = "business_code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["business_code_agent*"]
